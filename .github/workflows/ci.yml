name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile || pnpm install
      - name: TypeScript typecheck
        run: pnpm run typecheck
      - name: Contract, Security, Resilience, Persistence & Unit Tests
        run: pnpm run test
      - name: Dependency vulnerability audit (high/critical gate)
        run: pnpm audit --audit-level=high
      - name: Secret scanning check (no committed credentials)
        run: |
          if grep -rnE "sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----" packages/ services/ contracts/ docs/; then
            echo "Potential secret detected!"
            exit 1
          fi
